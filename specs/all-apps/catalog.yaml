        message:
          type: string
          description: Expense sync message if any.
          readOnly: true
        networkExpense:
          type: number
          description: Network expense of the resource.
          readOnly: true
        storageExpense:
          type: number
          description: Storage expense of the resource.
          readOnly: true
        totalExpense:
          type: number
          description: Total expense of the resource.
          readOnly: true
        unit:
          type: string
          description: Monetary unit.
          readOnly: true
