            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/PolicyDryRunDecisionPage"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePolicyDecisionObjectNode"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePolicyDecisionObjectNode"
          description: Forbidden
      summary: Fetch a list of policy decisions.
      tags:
      - Policy Decisions
  /policy/api/policyDecisions/{id}:
    get:
      description: Find a specific policy decision based on the input policy decision
        id.
      operationId: getDecisionById
      parameters:
      - description: Policy decision Id
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionObjectNode"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionObjectNode"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionObjectNode"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionObjectNode"
          description: Not Found
      summary: Returns a policy decision by id.
      tags:
      - Policy Decisions
  /policy/api/policyTypes:
    get:
      description: Find all the policy types available in the current org.
      operationId: getTypes
      parameters:
      - description: Retrieves the schema for this policy type
        in: query
        name: expandSchema
        required: false
        schema:
          type: boolean
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Number of records you want
        example: 1
        in: query
        name: $top
        schema:
          type: integer
      - description: Number of records you want to skip
        example: 1
        in: query
        name: $skip
        schema:
          type: integer
      - description: "Sorting criteria in the format: property (asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: $orderby
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePolicyType"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePolicyType"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePolicyType"
          description: Forbidden
      summary: Returns a paginated list of policy types.
      tags:
      - Policy Types
  /policy/api/policyTypes/{id}:
    get:
      description: Find a specific policy type based on the input policy type id.
      operationId: getPolicyTypeById
      parameters:
      - description: Policy type ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyType"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyType"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyType"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyType"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyType"
          description: Not Found
      summary: Returns the policy type with the specified ID.
      tags:
      - Policy Types
  /policy/api/policyTypes/{id}/scopeSchema:
    get:
      description: Return the policy scope schema for the given policy type.
      operationId: getPolicyTypeScopeSchema
      parameters:
      - description: Policy type ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSchemaImpl"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSchemaImpl"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSchemaImpl"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSchemaImpl"
          description: Not Found
      summary: Returns the policy scope schema for the type with the specified ID.
      tags:
      - Policy Types
components:
  schemas:
    ActionParameter:
      type: object
      properties:
        $type:
          $ref: "#/components/schemas/FormSchemaFieldType"
        parameterMap:
          type: object
          additionalProperties:
            type: object
    BlueprintCatalogItemPublishRequest:
      type: object
      allOf:
      - $ref: "#/components/schemas/CatalogItemPublishRequest"
      - type: object
        properties:
          spec:
            $ref: "#/components/schemas/BlueprintCatalogItemPublishSpec"
      required:
      - name
      - projectId
      - spec
    BlueprintCatalogItemPublishSpec:
      type: object
      description: Information specific to the content type.
      properties:
        blueprintId:
          type: string
          minLength: 1
        delete:
          type: boolean
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItemDependency"
        version:
          $ref: "#/components/schemas/BlueprintVersion"
      required:
      - blueprintId
    BlueprintVersion:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        formId:
          type: string
        name:
          type: string
        schema:
          $ref: "#/components/schemas/JsonSchemaImpl"
        unrelease:
          type: boolean
    CatalogItem:
      type: object
      description: Represents a Catalog Item that can eventually be requested by a
        consumer.
      properties:
        additionalActions:
          type: array
          description: "A List of available actions for the catalog item, e.g Unpublish,\
            \ Edit Projects"
          items:
            $ref: "#/components/schemas/CatalogItemAction"
        bulkRequestLimit:
          type: integer
          format: int32
          description: Max number of instances that can be requested at a time
        createdAt:
          type: string
          format: date-time
          description: Creation time
          readOnly: true
        createdBy:
          type: string
          description: Created By
          readOnly: true
        creator:
          $ref: "#/components/schemas/UserReference"
        description:
          type: string
          description: CatalogItem description
        externalId:
          type: string
          description: External ID
          readOnly: true
        formId:
          type: string
          description: Form ID
          readOnly: true
        global:
          type: boolean
          description: Indicates whether the catalog item can be assigned to other
            projects
        iconId:
          type: string
          format: uuid
          description: Icon ID
        id:
          type: string
          format: uuid
          description: CatalogItem id
          readOnly: true
        isRequestable:
          type: boolean
          description: Boolean flag to indicate whether the catalog item is requestable
            or not
        lastUpdatedAt:
          type: string
          format: date-time
          description: Update time
          readOnly: true
        lastUpdatedBy:
          type: string
          description: Updated By
          readOnly: true
        lastUpdater:
          $ref: "#/components/schemas/UserReference"
        name:
          type: string
          description: CatalogItem name
        organizationSharings:
          type: array
          description: List of organizations that the catalog item is being shared
            with.
          items:
            $ref: "#/components/schemas/CatalogItemOrganizationSharing"
        projectIds:
          type: array
          description: Associated project IDs that can be used for requesting
          items:
            type: string
            description: Associated project IDs that can be used for requesting
        projects:
          type: array
          description: Associated projects that can be used for requesting
          items:
            $ref: "#/components/schemas/ResourceReference"
        schema:
          $ref: "#/components/schemas/JsonSchemaImpl"
        sourceId:
          type: string
          format: uuid
          description: LibraryItem source ID.
          readOnly: true
        sourceName:
          type: string
          description: LibraryItem source name.
          readOnly: true
        sourceProjectId:
          type: string
          description: Project ID with which the catalog item was associated when
            created
        spec:
          $ref: "#/components/schemas/CatalogItemPublishSpec"
        type:
          $ref: "#/components/schemas/ResourceReference"
      required:
      - id
      - name
      - projectIds
      - type
    CatalogItemAction:
      type: object
      description: "A List of available actions for the catalog item, e.g Unpublish,\
        \ Edit Projects"
      properties:
        bundleKey:
          type: string
          description: Catalog Item action bundle Key
          readOnly: true
        id:
          type: string
          description: Catalog Item action id
          readOnly: true
        name:
          type: string
          description: Catalog Item action name
          readOnly: true
    CatalogItemDependency:
      type: object
      properties:
        type:
          type: string
          enum:
          - VMI
        value:
          type: object
    CatalogItemOrganizationSharing:
      type: object
      description: "List of organizations the catalog item is shared with. To share\
        \ with all organizations, include a single entry in the array with 'orgId'\
        \ set to 'ALL'"
      properties:
        orgId:
          type: string
          description: "ID of the organization the catalog item to be shared with.\
            \ To share with all organizations, set the value to 'ALL'."
      required:
      - orgId
    CatalogItemProjectAssignment:
      type: object
      description: list of projects to assign or un-assign.
      properties:
        projectsToAssign:
          type: array
          description: List of projects to be assigned.
          items:
            type: string
            description: List of projects to be assigned.
        projectsToUnAssign:
          type: array
          description: List of projects to be un-assigned.
          items:
            type: string
            description: List of projects to be un-assigned.
    CatalogItemPublishRequest:
      type: object
      description: A request to publish content to the catalog for the members of
        a specific project.
      discriminator:
        propertyName: typeId
      properties:
        description:
          type: string
          description: Catalog item description.
        global:
          type: boolean
          description: "Set to true to allow this catalog to be shared with multiple\
            \ projects, or false to restrict it to the specified project."
        iconId:
          type: string
          format: uuid
          description: ID of the icon to associate with this catalog item.
        name:
          type: string
          description: Catalog item name.
          minLength: 1
        organizationSharings:
          type: array
          description: "List of organizations the catalog item is shared with. To\
            \ share with all organizations, include a single entry in the array with\
            \ 'orgId' set to 'ALL'"
          items:
            $ref: "#/components/schemas/CatalogItemOrganizationSharing"
        projectId:
          type: string
          format: uuid
          description: ID of the project to share this catalog item with.
        spec:
          $ref: "#/components/schemas/CatalogItemPublishSpec"
        typeId:
          type: string
          description: "Type of content to be published, i.e., the catalog item type."
      required:
      - name
      - projectId
      - spec
    CatalogItemPublishSpec:
      type: object
      description: Information specific to the content type.
    CatalogItemRequest:
      type: object
      description: A request to create a deployment based on a catalog item
      properties:
        bulkRequestCount:
          type: integer
          format: int32
          description: Deployment request count; defaults to 1 if not specified.
        deploymentName:
          type: string
          description: Name of the requested deployment
          maxLength: 900
        inputs:
          type: object
        projectId:
          type: string
          description: Project to be used for the request
        reason:
          type: string
          description: Reason for request
          maxLength: 10240
        version:
          type: string
          description: Version of the catalog item. e.g. v2.0
    CatalogItemRequestResponse:
      type: object
      description: The blueprint service's response to a deployment request
      properties:
        deploymentId:
          type: string
          description: The created deployment's ID
        deploymentName:
          type: string
          description: The created deployment's name
    CatalogItemResourceUpfrontPriceResponse:
      type: object
      description: A response with upfront price for a resource in given catalog item
      properties:
        dailyAdditionalPrice:
          type: number
          description: Additional Price incurred for the catalog.
          readOnly: true
        dailyComputePrice:
          type: number
          description: Compute Price of the catalog resource.
          readOnly: true
        dailyNetworkPrice:
          type: number
          description: Network Price of the catalog resource.
          readOnly: true
        dailyStoragePrice:
          type: number
          description: Storage Price of the catalog resource.
          readOnly: true
        dailyTotalPrice:
          type: number
          description: Total Price of the catalog resource.
          readOnly: true
        resourceName:
          type: string
        resourceType:
          type: string
        resourceUpfrontPriceId:
          type: string
          description: Id
          readOnly: true
        status:
          type: string
          description: Upfront price sync status
          enum:
          - SUCCESS
          - ERROR
          - DATA_NOT_AVAILABLE
          - CURRENCY_NOT_SET
          readOnly: true
        statusDetails:
          type: string
          description: Upfront price status detail.
          readOnly: true
        unit:
          type: string
          description: Monetary unit.
          readOnly: true
    CatalogItemUpfrontPriceResponse:
      type: object
