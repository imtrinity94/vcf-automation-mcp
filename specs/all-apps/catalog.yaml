          description: Additional expense incurred for the resource.
          readOnly: true
        code:
          type: string
          description: Expense sync message code if any.
          readOnly: true
        computeExpense:
          type: number
          description: Compute expense of the resource.
          readOnly: true
        lastUpdatedTime:
