        dailyAdditionalPrice:
          type: number
          description: Additional Price incurred for the catalog.
          readOnly: true
        dailyComputePrice:
          type: number
          description: Compute Price of the catalog.
          readOnly: true
        dailyNetworkPrice:
          type: number
          description: Network Price of the catalog.
          readOnly: true
        dailyStoragePrice:
          type: number
          description: Storage Price of the catalog.
          readOnly: true
        dailyTotalPrice:
          type: number
          description: Total Price of the catalog.
          readOnly: true
        resourcePriceDetails:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItemResourceUpfrontPriceResponse"
        status:
          type: string
          description: Upfront price sync status
          enum:
          - STARTED
          - PREPARING_COST_ESTIMATION
          - IN_PROGRESS
          - SUCCESS
          - ERROR
          - DATA_NOT_AVAILABLE
          - CURRENCY_NOT_SET
          - PUBLIC_CLOUD_NOT_SUPPORTED
          readOnly: true
        statusDetails:
          type: string
          description: Upfront price status detail.
          readOnly: true
        unit:
          type: string
          description: Monetary unit.
          readOnly: true
        upfrontPriceId:
          type: string
          description: Id
          readOnly: true
    CatalogItemVersion:
