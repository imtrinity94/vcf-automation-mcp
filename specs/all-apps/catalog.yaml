          description: Message of the event log
        rownum:
          type: integer
          format: int32
          description: Row number of the Event Log.
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the Event log (e.g. date format '2019-07-13T23:16:49.310Z').
